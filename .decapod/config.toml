schema_version = "1.0.0"

[init]
specs = false
ci = false
diagram_style = "ascii"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]

[repo]
product_name = "home-manager"
product_summary = "Declarative Nix, Home Manager, nix-darwin, nix-on-droid, and Guix configuration for mahakala, paphos, oracle, M-02877, and pixel-fold."
architecture_direction = "Composable repository architecture with explicit boundaries and proof-backed delivery invariants."
product_type = "service_or_library"
done_criteria = "Decapod validate passes, required tests pass, and promotion-relevant artifacts are present."
base_branch = "main"
primary_languages = [
    "nix",
    "shell",
]
detected_surfaces = ["shell"]
external_tracker = true
container_workspaces = false
backend = "local"
declared_capabilities = [
    "infrastructure-management",
    "secrets-handling",
]

[governance]
protected_paths = []
approval_categories = ["destructive_operations"]

# TEMPORARY (owner approval, 2026-11-10; bead home-manager-wks): pi-dktaohan may
# accept the 13 historical journal gaps once. A follow-up PR removes this table.
[governance.rbac]
actor_roles = { "pi-dktaohan" = ["journal-repair"] }
journal_repair_roles = ["journal-repair"]

[proof]
validation_buildkite_preflights = false

[proof.required_profile]
id = "repo.pr-readiness.v1"
reviewed_sources_digest = "sha256:49b8dda8aefbd30935f90f52c3528025020ca4df7889c67a41adbd85c34cabf3"

[[proof.commands]]
name = "fmt"
command = "/nix/store/h2a5rp9w02cd2ml1wd7yh3lbbsc4rp55-alejandra-4.1.0/bin/alejandra"
args = ["--check", "flake.nix", "modules/", "secrets/", "guix/", "guix-packages/", "pkgs/"]
required = true

[[proof.commands]]
name = "shellcheck"
command = "/nix/store/7i826r202acdz8c2q6hsggy44s1rkk0k-shellcheck-0.11.0-bin/bin/shellcheck"
args = ["scripts/bump-flake-inputs.sh", "scripts/cask-app-preflight.sh", "scripts/check-decapod-overrides.sh", "scripts/check-drvpaths.sh", "scripts/decapod-deploy-backup.sh", "scripts/decapod-validate-ci.sh", "scripts/deploy-freshness.sh", "scripts/gc-remote.sh", "scripts/hm-app-signing.sh", "scripts/test-decapod-deploy-backup.sh", "scripts/test-omarchy-share.sh", "scripts/upgrade-cachyos-kernel.sh"]
required = true

[proof.repository_contract]
reviewed_commands_digest = "sha256:342e180411fe118b2a657c147ed079983730fae4fa8c523c9af097bae3bd7467"
source_coverage = [
    { source = ".github/workflows/bump.yml", ci_only = true, reason = "A nightly and manual job. It opens the flake-input bump PR and checks no candidate. The bump PR gets the same checks as other PRs." },
    { source = ".github/workflows/dagger.yml", ci_only = true, reason = "It runs dagger check in a container engine on GitHub-hosted runners. The repository profile has no container engine, no Nix daemon and no network." },
    { source = ".github/workflows/decapod-validate.yml", commands = ["fmt", "shellcheck"] },
    { source = ".github/workflows/eval-targets.yml", ci_only = true, reason = "It evaluates the drvPath of each deploy target with Nix on GitHub-hosted runners. The repository profile refuses Nix daemon and network operations." },
    { source = ".github/workflows/shepherd.yml", ci_only = true, reason = "Merge automation on a schedule, after the check workflows and on PR comments. It merges PRs that pass the merge rules and checks no candidate." },
]

[proof.repository_contract.executions.fmt]
program = "/nix/store/h2a5rp9w02cd2ml1wd7yh3lbbsc4rp55-alejandra-4.1.0/bin/alejandra"
toolchain_files = { alejandra = "/nix/store/h2a5rp9w02cd2ml1wd7yh3lbbsc4rp55-alejandra-4.1.0/bin/alejandra" }
environment = {}
directory = "."
timeout_seconds = 300

[proof.repository_contract.executions.shellcheck]
program = "/nix/store/7i826r202acdz8c2q6hsggy44s1rkk0k-shellcheck-0.11.0-bin/bin/shellcheck"
toolchain_files = { shellcheck = "/nix/store/7i826r202acdz8c2q6hsggy44s1rkk0k-shellcheck-0.11.0-bin/bin/shellcheck" }
environment = {}
directory = "."
timeout_seconds = 300

[custody]
isolation = "worktree"

[tracker]
provider = "beads"

[context]
declared_sources = []
