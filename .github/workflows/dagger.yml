# Runs the checks of the Dagger module .dagger/modules/ci on a GitHub-hosted
# runner (plan docs/plans/2026-10-30-001-dagger-ci-autonomous-merge-plan.md,
# P2). Standard runners are free for a public repository, and each job gets a
# new virtual machine. The job gets no secret, and the token can only read.
#
# Branch protection on main requires the job den/dagger-check.
name: dagger

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dagger-check:
    name: den/dagger-check
    # The system of the engine on M-02877, so this job runs the checks that
    # `just dagger-check` runs there.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The module pins its engine release in one file.
      - name: Read the engine release of the module
        id: engine
        run: |
          version="$(sed -n 's/^engineVersion = "v\(.*\)"$/\1/p' .dagger/modules/ci/dagger-module.toml)"
          if [ -z "$version" ]; then
            echo "::error::.dagger/modules/ci/dagger-module.toml has no engineVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.engine.outputs.version }}
          verb: check
