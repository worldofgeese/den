name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Decapod compares the event's base and head, so it needs the history
          # and the origin/main ref.
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # AGENTS.md names the one Decapod release that governs den
      # (VALIDATION.md, "Decapod Upgrades and the Merge Gate"). CI installs
      # exactly that release, and the cache key holds it. Before, CI installed
      # the newest crate and cached it by the hash of AGENTS.md.
      - name: Read the pinned Decapod release
        id: decapod_pin
        run: |
          version="$(sed -n 's/^<!-- decapod-release: \([0-9][0-9.]*\) -->$/\1/p' AGENTS.md)"
          if [ -z "$version" ]; then
            echo "::error::AGENTS.md has no decapod-release header"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache cargo-binstall and Decapod
        id: cache_decapod_tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod-tools-v2-${{ steps.decapod_pin.outputs.version }}
      - name: Install cargo-binstall
        if: steps.cache_decapod_tools.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main
      - name: Install Decapod
        if: steps.cache_decapod_tools.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm "decapod@${{ steps.decapod_pin.outputs.version }}"
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
          # Post-merge: tree-local binary fingerprints lag the last published pin.
          # PRs still enforce release-bound pins + drift.
          DECAPOD_VALIDATE_SKIP_FINGERPRINT_GATES: ${{ github.event_name == 'push' && '1' || '' }}
          # Decapod requires the immutable change range of the event.
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ ! -d .decapod ]; then
            decapod init --proof
          fi
          decapod validate --refresh-specs
      - name: Ensure no spec or entrypoint drift
        if: github.event_name == 'pull_request'
        # validate rewrites generated_at every run; that is not semantic drift.
        # Normalize it to HEAD before the exit-code check so only real content,
        # entrypoint, Dockerfile, or manifest hash drift fails CI.
        run: |
          set -euo pipefail
          MANIFEST=".decapod/managed/specs/.manifest.json"
          if git cat-file -e "HEAD:${MANIFEST}" 2>/dev/null && [ -f "${MANIFEST}" ]; then
            OLD=$(git show "HEAD:${MANIFEST}" | sed -n 's/.*"generated_at": "\([^"]*\)".*/\1/p' | head -1)
            if [ -n "${OLD}" ]; then
              sed -i "s/\"generated_at\": \"[^\"]*\"/\"generated_at\": \"${OLD}\"/" "${MANIFEST}"
            fi
          fi
          if ! git diff --exit-code -- . ':!.decapod/governance/' ':!.decapod/governance.json'; then
            echo "::error::Release-bound or living-spec drift after validate --refresh-specs."
            echo "Commit regenerated entrypoints and .decapod/managed/specs from the evaluating binary."
            exit 1
          fi
