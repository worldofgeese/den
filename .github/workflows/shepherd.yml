# The shepherd of plan P3 (docs/plans/2026-10-30-001-dagger-ci-autonomous-merge-plan.md).
# For each open pull request, it asks the Codex connector to review the head
# when the head has no review: `dagger call ci shepherd`. After 3 requests
# without a review, it adds the label needs-human.
#
# The job runs the code of main only, and it never checks out a pull request.
# The token DEN_SHEPHERD_TOKEN comes from the environment shepherd, which only
# jobs on main can use. The job makes no deployment record.
name: shepherd

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: [dagger]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once could ask twice for one head.
concurrency:
  group: shepherd
  cancel-in-progress: false

jobs:
  shepherd:
    name: den/shepherd
    runs-on: ubuntu-24.04-arm
    environment:
      name: shepherd
      deployment: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # The module pins its engine release in one file.
      - name: Read the engine release of the module
        id: engine
        run: |
          version="$(sed -n 's/^engineVersion = "v\(.*\)"$/\1/p' .dagger/modules/ci/dagger-module.toml)"
          if [ -z "$version" ]; then
            echo "::error::.dagger/modules/ci/dagger-module.toml has no engineVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          DEN_SHEPHERD_TOKEN: ${{ secrets.DEN_SHEPHERD_TOKEN }}
        with:
          version: ${{ steps.engine.outputs.version }}
          verb: call
          args: ci shepherd --token env://DEN_SHEPHERD_TOKEN
          enable-github-summary: true
