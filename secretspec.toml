[project]
name = "home-manager"
revision = "1.0"

# `personal` is defined per host in ~/.config/secretspec/config.toml, which
# modules/shared-devtools.nix generates: on M-02877 it is secretspec.age (one
# Keychain prompt per secretspec build, not one per secret); elsewhere the
# keyring. The trailing keyring reads values not yet moved by
# `just secretspec-age-setup`. Writes go to `personal`.
[defaults]
providers = ["personal", "keyring"]

[profiles.default]
LEGO_GATEWAY_API_KEY = { description = "LEGO AI Model Gateway virtual key (vk_...) used by the Pi anthropic-proxy provider", required = true }
HOMEBREW_GITHUB_API_TOKEN = { description = "GitHub token for Homebrew API rate limits, read by nix-darwin activation", required = false }
CACHIX_AUTH_TOKEN = { description = "Cachix personal auth token for pushing to the worldofgeese binary cache", required = true }
CHORUS_API_KEY = { description = "Chorus AI-DLC agent API key (cho_...) used by the omp/claude Chorus MCP server", required = false }
CONFLUENCE_API_TOKEN = { description = "Atlassian API token (ATATT...) read by the mdc Confluence CLI; exported by zsh initContent", required = false }
CONTEXT7_API_KEY = { description = "Context7 API key (ctx7sk-...) for the context7-mcp server in ~/.claude.json and the ctx7 CLI; exported by zsh initContent", required = false }
HM_APP_SIGNING_KEYCHAIN_PASSWORD = { description = "Password of ~/Library/Keychains/hm-app-signing.keychain-db, which holds the local code-signing key scripts/hm-app-signing.sh uses; generated by `hm-app-signing setup`", required = false }
GITHUB_PAT = { description = "GitHub OAuth token (gho_...) formerly inlined in ~/.claude/settings.json env; no known consumer, resolve on demand", required = false }
